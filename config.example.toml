# 复制为 config.toml 后按需修改。时间口径统一北京时间。
# 依赖：零第三方 Python 包；唯一外部工具是 CuaDriver（trycua AX 驱动，GUI 应用）。

base_url = "https://www.workbuddy.cn/app"
state_db = "~/.local/share/buddy-web-checkin/state.sqlite3"
log_level = "INFO"

[desktop]
# 桌面端：仅每日签到。唯一后端 CuaDriver（已授权 com.trycua.driver AX 路径，
# 不移动光标、不抢焦点）
cua_driver_bin = "/Applications/CuaDriver.app/Contents/MacOS/cua-driver"
app = "WorkBuddy"
# 面板收起时用于展开的入口按钮；不同客户端版本文案可能不同
station_entry_labels = ["Buddy加油站", "做任务赢积分"]
# 点击后出现的「今天已领」文案，作为已签到的强证据
already_claimed_labels = ["今日已领取", "已领取", "明日再来", "今日已领"]
# AXPress -25202（元素引用失效）时重新快照定位的重试次数/间隔
click_max_attempts = 3
click_retry_delay_sec = 0.8

[daily_checkin]
enabled = true          # 签到时间线的总开关；周期见下方 [schedule]

[schedule]
# 统一常驻进程的三条时间线。只有 travel 是动态滚动：
#   checkin   每天 0 点恢复每小时轮询，签到成功 -> 禁用到当天 23:59
#   exchange  每天 0 点恢复每小时轮询，兑换成功或确认无可兑换 -> 禁用到当天 23:59
#   travel    重启先领礼物/派遣，之后按页面真实倒计时设置下次检查
# 进程启动时三条线都立即执行一次，然后各自从该时刻向后滚动。
day_boundary = "00:00"
hourly_interval_sec = 3600

[gifts]
enabled = true
allow_keywords = ["今日礼包", "签到", "连签", "盲盒", "抽奖", "旅行", "奖励", "领取"]
deny_keywords = ["去完成", "邀约", "充值", "购买", "开通", "升级"]
max_claims_per_run = 20

# 成长中心（领礼物 / 派遣 / 兑换）：走 CuaDriver AX 通道操作已登录的 Edge 个人中心
# 派遣实际时长每次不同（页面只提示 1~4 小时），工具每次从「旅行倒计时 HH:MM:SS」读真实剩余秒数
[growth]
enabled = true
cua_driver_bin = "/Applications/CuaDriver.app/Contents/MacOS/cua-driver"
# auto = 探测任意浏览器里已打开的成长中心窗口（Chrome/Edge/Safari 等均可）；
# 如需限定某一浏览器，可填其 app 名（如 "Microsoft Edge" / "Google Chrome"）
browser_app = "auto"
title_hint = "个人中心"
# 客户端窗口可能显示含成长关键词的文档/对话，默认排除避免误判
exclude_apps = ["WorkBuddy"]
scene = ""              # 可填 咖啡馆 / 商场店铺 / 健身房 / 古镇客栈；留空用默认
claim_offset_sec = 3
auto_exchange = true    # 补登卡等有限资源不会自动消耗
# 浏览器里没有成长中心页面时，自动从 WorkBuddy 客户端入口触发打开页面
# （另一台机器全新安装时无需人工先点开页面）。带冷却避免反复打开新标签页。
auto_open_page = true
# 「成长计划」实测会打开 CodeBuddy 积分页，故不放默认候选
auto_open_labels = ["做任务赢积分", "任务中心", "Buddy加油站"]
auto_open_wait_sec = 6
auto_open_cooldown_sec = 300
# 点击入口后仍找不到页面时，后台打开目标 URL（open -g 不抢焦点）
auto_open_url = "https://www.workbuddy.cn/profile/growth-center"
auto_open_url_fallback = true

[travel]
enabled = true
claim_offset_sec = 3     # 到期后延后 3 秒再领，避免服务端尚未结算
re_dispatch = true       # 领完立刻再派，形成闭环
fallback_interval_sec = 3600
end_field_candidates = ["end_at", "endTime", "end_time", "finish_at", "finishTime", "expire_at", "travel_end_at", "return_at", "arrive_at"]
remaining_field_candidates = ["remaining_seconds", "remainSeconds", "remain_seconds", "left_seconds", "countdown", "remaining", "leftTime", "seconds_left"]
state_field_candidates = ["state", "status", "travel_state"]

[travel.state_values]
idle = ["idle", "none", "not_started", "ready"]
traveling = ["traveling", "travelling", "running", "in_progress", "ongoing"]
claimable = ["claimable", "completed", "finished", "done", "reward_pending"]

[dom_fallback]
checkin = ["立即领取", "领取今日礼包", "今日礼包", "签到领取"]
dispatch = ["派猫猫旅行", "派 Buddy 去旅行", "派出去", "出发采风"]
claim_travel = ["领取旅行奖励", "领取奖励", "收下礼物", "领取礼物"]
gift_claim = ["领取", "开盲盒", "开启一次盲盒", "抽奖", "立即抽奖"]
already_claimed = ["已领取", "明日再来", "今日已领", "已签到"]
traveling = ["旅行中", "采风中", "倒计时"]

[notify]
webhook = ""
macos = false

# 依赖 WorkBuddy：签到在客户端内、成长中心是 WorkBuddy 个人中心。作为 WorkBuddy 技能 / 定时任务
# 运行时消耗模型额度，必须运行在「免费模型」下。每次执行（含定时器）前，请先在 WorkBuddy 模型
# 选择器选「免费模型」，再以 BUDDY_FREE_MODEL=1 显式确认，否则命令拒绝执行。
[runtime]
require_free_model = true
free_model_hint = "WorkBuddy 模型选择器 → 免费模型"
