# 复制为 config.toml 后按需修改。时间口径统一北京时间。
# 运行时链路：agent-browser + WorkBuddy 客户端 CDP 调试端口（默认 9222）。
# 零第三方 Python 包；npm 依赖只有 agent-browser（必需）与 agent-desktop（可选兜底）。

base_url = "https://www.workbuddy.cn/app"
state_db = "~/.local/share/buddy-web-checkin/state.sqlite3"
log_level = "INFO"

[desktop]
# 签到走主窗口左下角「Buddy加油站」浮层（adapters/fuel_card.py），不经桌面端。
# 本段仅保留 agent-desktop（可选 AX 兜底），不参与日常流程。
# 注意 TCC 授权绑「实际启动它的 App」（如 iTerm/Terminal），需先把该 App 加入
# 系统设置→隐私与安全性→辅助功能（macOS 27+ 设备控制和数据访问）。
agent_desktop_bin = "node_modules/.bin/agent-desktop"
agent_desktop_session = "buddy-checkin"
# 检测到登录/验证码：0=只自动截图+报告不阻塞；>0=等待人工登录的秒数。
# 绝不自动填账号密码、不绕人机验证。
login_wait_sec = 0
screenshot_dir = "~/.local/share/buddy-web-checkin/screenshots"
app = "WorkBuddy"

[daily_checkin]
enabled = true          # 签到时间线的总开关；周期见下方 [schedule]
# 签到语义（2026-11-14 更正）：点左下角「Buddy加油站」浮层的「立即领取」。
# 只有看到「领取成功」/签到卡消失才落库；没有 24h 冷却。

[schedule]
# 五个任务：签到 / 补签 / 兑换 / 抽奖 / 派遣。每个任务独立滚动：
#   - 失败按 retry_backoff_sec 退避重试，直到成功或确认「今天做不了」
#   - 只有五个任务全部 done/impossible（当日 100% 完成且无法继续）才静默到 silent_at
#   - 次日 0 点账本翻页，全部重置
#   - 进程重启不受静默控制：五个任务立刻用真实状态复核一遍（不信任账本）
day_boundary = "00:00"
silent_at = "23:59"
retry_backoff_sec = [60, 120, 300, 600]
hourly_interval_sec = 3600    # 兼容旧配置，新调度用 retry_backoff_sec

[gifts]
enabled = true
allow_keywords = ["今日礼包", "签到", "连签", "盲盒", "抽奖", "旅行", "奖励", "领取"]
deny_keywords = ["去完成", "邀约", "充值", "购买", "开通", "升级"]
max_claims_per_run = 20

# 成长中心（签到状态校验 / 领礼物 / 派遣 / 兑换）：CDP 直连客户端内嵌 iframe
# 派遣实际时长每次不同（页面只提示 1~4 小时），每次从「旅行倒计时 HH:MM:SS」读真实剩余秒数
[growth]
enabled = true
# 唯一实现：browser = GrowthBrowser（CDP + DOM 级点击）
engine = "browser"
# WorkBuddy 客户端调试端口。这只是**回退值**：运行时优先跟随客户端自报的
# DevToolsActivePort 与 gui 域环境变量，被占用会自动换端口（ports.py）。
#   ./run.sh ports status / ports negotiate --apply
#   ./scripts/launch-workbuddy-debug.sh   写端口并优雅重启客户端
cdp_port = 9222
# 协商时按顺序找空闲端口的区间 [起, 止]
cdp_port_range = [9222, 9242]
# agent-browser 可执行文件；留空按 tools/node_modules/.bin → PATH 顺序探测
agent_browser_bin = ""
# 页面未打开时，从客户端侧栏入口点开的按钮文案（依次尝试）。
# 5.11.2 实测入口是「成长计划」，点后出现「立即前往」再点一次才打开成长中心
open_labels = ["成长计划", "做任务赢积分", "任务中心"]
open_wait_sec = 6
scene = ""              # 可填 咖啡馆 / 商场店铺 / 健身房 / 古镇客栈；留空用默认
claim_offset_sec = 3
auto_exchange = true    # 自动兑换连登里程碑奖励
auto_lottery = true     # 自动抽奖：把「抽奖(N)」抽到 0
auto_makeup = true      # 漏签自动补签（会消耗补登卡，卡为 0 则当天不再尝试）
# 任务结束后关闭成长中心弹窗；只关本次工具自己打开的，用户开着的不动
close_page_after_action = true

[travel]
enabled = true
claim_offset_sec = 3     # 到期后延后 3 秒再领，避免服务端尚未结算
re_dispatch = true       # 领完立刻再派，形成闭环
fallback_interval_sec = 3600
# 派遣次数当天用尽时禁用到此时刻（北京时间）；已过则次日 0 点再试
exhausted_retry_at = "23:00"
end_field_candidates = ["end_at", "endTime", "end_time", "finish_at", "finishTime", "expire_at", "travel_end_at", "return_at", "arrive_at"]
remaining_field_candidates = ["remaining_seconds", "remainSeconds", "remain_seconds", "left_seconds", "countdown", "remaining", "leftTime", "seconds_left"]
state_field_candidates = ["state", "status", "travel_state"]

[travel.state_values]
idle = ["idle", "none", "not_started", "ready"]
traveling = ["traveling", "travelling", "running", "in_progress", "ongoing"]
claimable = ["claimable", "completed", "finished", "done", "reward_pending"]

[notify]
webhook = ""
macos = false

# 依赖 WorkBuddy：签到在客户端内、成长中心是 WorkBuddy 个人中心。作为 WorkBuddy 技能 / 定时任务
# 运行时消耗模型额度，必须运行在「免费模型」下。每次执行（含定时器）前，请先在 WorkBuddy 模型
# 选择器选「免费模型」，再以 BUDDY_FREE_MODEL=1 显式确认，否则命令拒绝执行。
[runtime]
require_free_model = true
free_model_hint = "WorkBuddy 模型选择器 → 免费模型"
